version: 2.1

orbs:
  go: circleci/go@1.7.1
  aws-cli: circleci/aws-cli@3.2.0

# The Go we test and build against
goversion: &goversion "1.26"

jobs:
  test:
    executor:
      name: go/default
      tag: *goversion
    steps:
      - checkout
      - go/load-cache
      - go/mod-download
      - run: make test
      - store_test_results:
          path: ./unit-tests.xml
      - go/save-cache
  # Runs the extension inside the Lambda Runtime Interface Emulator, driven by the
  # real Extensions and Telemetry APIs, and asserts on the events it delivers.
  #
  # A machine executor rather than a docker one: the test publishes a container
  # port and expects to reach it locally, and the container has to reach a stand-in
  # API in the job. With setup_remote_docker the daemon is on another host, so
  # neither direction works.
  test_emulator:
    parameters:
      resource_class:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>
    steps:
      - checkout
      # The image's Go is used as-is. Since Go 1.21 the toolchain switches
      # automatically to whatever go.mod asks for, so this compiles with the
      # version we build against without pinning anything here.
      - run: go version
      - restore_cache:
          keys:
            - rie-emulator-v1-{{ arch }}-{{ checksum "test/rie/emulator.go" }}
      - go/load-cache
      - go/mod-download
      - run:
          name: "Run the extension in the Lambda emulator"
          command: make test-rie
          # Pulling the Lambda base image and building the emulator take a while
          # before any test output appears.
          no_output_timeout: 20m
      - save_cache:
          key: rie-emulator-v1-{{ arch }}-{{ checksum "test/rie/emulator.go" }}
          paths:
            - /tmp/hny-lambda-ext-emulator
      - go/save-cache
  build_extension:
    executor:
      name: go/default
      tag: *goversion
    steps:
      - checkout
      - go/load-cache
      - go/mod-download
      - go/save-cache
      - run:
          name: "Build binaries and layer content ZIPs"
          environment:
            GOOS: linux
          command: make zips
      - run:
          name: "Copy binaries and ZIPs to persist for CI workspace"
          command: |
            mkdir -p ~/artifacts
            cp -R ./artifacts/* ~/artifacts/
      - persist_to_workspace:
          root: ~/
          paths:
            - artifacts
      - store_artifacts:
          path: ~/artifacts
  publish_aws:
    docker:
      - image: cimg/go:1.26
    steps:
      - attach_workspace:
          at: ~/
      - checkout
      - aws-cli/setup:
          role-arn: ${AWS_ROLE_ARN}
          role-session-name: "honeycomb-lambda-extension"
          aws-region: AWS_REGION
      - run:
          name: "Publish extension to AWS"
          command: ./publish.sh
  publish_github:
    docker:
      - image: cibuilds/github:0.13.0
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: "Artifacts being published"
          command: |
            echo "about to publish to tag ${CIRCLE_TAG}"
            ls -l ~/artifacts/*
      - run:
          name: "GHR Draft"
          command: ghr -draft -n ${CIRCLE_TAG} -t ${GITHUB_TOKEN} -u ${CIRCLE_PROJECT_USERNAME} -r ${CIRCLE_PROJECT_REPONAME} -c ${CIRCLE_SHA1} ${CIRCLE_TAG} ~/artifacts/linux
  publish_s3:
    docker:
      - image: cimg/go:1.26
    steps:
      - attach_workspace:
          at: ~/
      - aws-cli/setup:
          role-arn: ${AWS_ROLE_ARN}
          role-session-name: "honeycomb-lambda-extension"
          aws-region: AWS_REGION
      - run:
          name: "Artifacts being published"
          command: |
            echo "about to publish ${CIRCLE_TAG} to S3"
            ls -l ~/artifacts/*
      - run:
          name: "S3 Release"
          command: aws s3 cp ~/artifacts/linux s3://honeycomb-builds/honeycombio/honeycomb-lambda-extension/${CIRCLE_TAG}/ --recursive

workflows:
  nightly:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - test
      - test_emulator:
          matrix:
            parameters:
              resource_class: ["large", "arm.large"]

  build:
    jobs:
      - test:
          filters:
            tags:
              only: /.*/
      # Both architectures are published, so both are exercised. Skipped for
      # forked pull requests, which cannot reach the emulator build.
      - test_emulator:
          matrix:
            parameters:
              resource_class: ["large", "arm.large"]
          filters:
            tags:
              only: /.*/
            branches:
              ignore:
                - /pull\/.*/
      - build_extension:
          context: Honeycomb Secrets for Public Repos
          filters:
            tags:
              only: /.*/
            branches:
              ignore:
                - /pull\/.*/
                - /dependabot\/.*/
      - publish_s3:
          context: Honeycomb Secrets for Public Repos
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - test
            # The matrix alias defaults to the job name, so this waits for every
            # architecture rather than naming the generated jobs.
            - test_emulator
            - build_extension
      - publish_aws:
          context: Honeycomb Secrets for Public Repos
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - test
            # The matrix alias defaults to the job name, so this waits for every
            # architecture rather than naming the generated jobs.
            - test_emulator
            - build_extension
      - publish_github:
          context: Honeycomb Secrets for Public Repos
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
          requires:
            - test
            # The matrix alias defaults to the job name, so this waits for every
            # architecture rather than naming the generated jobs.
            - test_emulator
            - build_extension
